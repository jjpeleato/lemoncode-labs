<mat-sidenav-container class="app-shell">
  <mat-sidenav #drawer mode="over" [opened]="menuOpen">
    <app-menu-public />
    <app-menu-private />
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="accent">
      <button mat-icon-button (click)="drawer.toggle()">
        <mat-icon>menu</mat-icon>
      </button>
    </mat-toolbar>

    <app-header-public />
    <app-header-private />

    <main class="app-content">
      <router-outlet />
    </main>

    <app-footer />
  </mat-sidenav-content>
</mat-sidenav-container>
