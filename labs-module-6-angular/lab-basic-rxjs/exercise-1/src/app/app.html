<mat-sidenav-container class="app-shell">
  <mat-sidenav #drawer mode="over" [opened]="menuOpen">
    @if (auth.isLogged()) {
    <app-menu-private />
    } @else {
    <app-menu-public />
    }
  </mat-sidenav>

  <mat-sidenav-content>
    <div class="content-shell">
      @if (auth.isLogged()) {
      <app-header-private (menuToggle)="drawer.toggle()" />
      } @else {
      <app-header-public (menuToggle)="drawer.toggle()" />
      }

      <main class="app-content">
        <router-outlet />
      </main>

      <app-footer />
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
