<main class="rotate-demo">
  <h1>Rotate directive demo</h1>

  <div class="rotate-demo__items">
    <img rotate src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=200" alt="Default rotation" />
    <img rotate="45" src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=200" alt="Initial rotation 45deg" />
    <img rotate="45" step="15" src="https://images.unsplash.com/photo-1518791841217-8f162f1e1131?w=200" alt="Initial rotation 45deg, step 15" />

    <div rotate class="rotate-demo__box">
      non-img element, selector is restricted to img[rotate]
    </div>
  </div>

  <p class="rotate-demo__hint">Click to rotate. Shift+click to rotate the other way.</p>
</main>
