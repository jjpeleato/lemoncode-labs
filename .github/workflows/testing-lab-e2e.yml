name: Testing Lab - E2E Tests

on:
  push:
    paths:
      - "labs-module-9-testing/lab-basic/exercise-1/**"
      - ".github/workflows/testing-lab-e2e.yml"
  pull_request:
    paths:
      - "labs-module-9-testing/lab-basic/exercise-1/**"
      - ".github/workflows/testing-lab-e2e.yml"

defaults:
  run:
    working-directory: labs-module-9-testing/lab-basic/exercise-1

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: labs-module-9-testing/lab-basic/exercise-1/package-lock.json

      - run: npm ci

      - run: npm run build

      - run: npm run e2e

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: cypress-screenshots
          path: labs-module-9-testing/lab-basic/exercise-1/cypress/screenshots
          if-no-files-found: ignore
