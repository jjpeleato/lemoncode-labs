name: Cloud Lab - Vercel

on:
  push:
    branches:
      - main
    paths:
      - "labs-module-11-cloud/lab-basic/exercise-1/**"
      - ".github/workflows/cloud-lab-vercel.yml"
  workflow_dispatch:

concurrency:
  group: vercel
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

defaults:
  run:
    working-directory: labs-module-11-cloud/lab-basic/exercise-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: labs-module-11-cloud/lab-basic/exercise-1/package-lock.json

      - run: npm install --global vercel@latest

      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
